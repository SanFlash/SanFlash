<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">SanFlash — Satyendra Kumar Namdeo</title>
<desc id="desc">Animated futuristic developer profile banner in midnight indigo, electric violet and cyan.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A18"/><stop offset=".48" stop-color="#17113D"/><stop offset="1" stop-color="#061B2A"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset=".48" stop-color="#C084FC"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  <radialGradient id="violetGlow"><stop stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="cyanGlow"><stop stop-color="#22D3EE" stop-opacity=".19"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="390" rx="26" fill="url(#bg)"/>
<rect width="1280" height="390" rx="26" fill="url(#grid)"/>
<ellipse cx="1030" cy="170" rx="300" ry="250" fill="url(#violetGlow)" filter="url(#soft)"/>
<ellipse cx="1190" cy="320" rx="220" ry="150" fill="url(#cyanGlow)" filter="url(#soft)"/>
<g fill="none" stroke-linecap="round">
  <path d="M700 64C890 -25 1120 5 1270 112" stroke="#8B5CF6" stroke-width="2" stroke-opacity=".55"/>
  <path d="M690 96C900 10 1115 45 1275 158" stroke="#67E8F9" stroke-width="1.5" stroke-opacity=".38"/>
  <path d="M780 324C980 220 1130 235 1270 300" stroke="#A78BFA" stroke-width="2" stroke-opacity=".38"/>
  <ellipse cx="1040" cy="190" rx="180" ry="108" stroke="#A78BFA" stroke-opacity=".30" stroke-width="1.5" transform="rotate(-18 1040 190)"/>
  <ellipse cx="1040" cy="190" rx="240" ry="145" stroke="#67E8F9" stroke-opacity=".18" stroke-width="1" transform="rotate(22 1040 190)"/>
  <ellipse cx="1040" cy="190" rx="130" ry="78" stroke="#C084FC" stroke-opacity=".20" stroke-width="1" transform="rotate(55 1040 190)"/>
</g>
<g fill="#D8B4FE" filter="url(#glow)">
  <circle cx="850" cy="75" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="86" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="1200" cy="278" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="775" cy="300" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="45" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
</g>
<g transform="translate(78 76)">
  <rect width="62" height="62" rx="18" fill="#171334" stroke="#8B5CF6" stroke-opacity=".9"/>
  <path d="M20 18L10 31L20 44M42 18L52 31L42 44M35 14L27 48" fill="none" stroke="url(#neon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-5" y="-5" width="72" height="72" rx="22" fill="none" stroke="#67E8F9" stroke-opacity=".25"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></rect>
</g>
<text x="78" y="181" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">HELLO, I'M</text>
<text x="76" y="238" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="-1.2">Satyendra Kumar Namdeo</text>
<rect x="80" y="260" width="550" height="3" rx="2" fill="url(#neon)"><animate attributeName="width" values="240;550;420;550" dur="8s" repeatCount="indefinite"/></rect>
<text x="80" y="301" fill="#E0E7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">QA Automation  ·  Test Engineering  ·  AI-Assisted Development</text>
<text x="80" y="350" fill="#8291B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">SANFLASH  /  ENGINEERING WITH INTENT</text>
<g transform="translate(930 147)">
  <circle cx="92" cy="48" r="88" fill="#8B5CF6" opacity=".06"/>
  <circle cx="92" cy="48" r="68" fill="none" stroke="#8B5CF6" stroke-width="1.7" stroke-opacity=".7"/>
  <circle cx="92" cy="48" r="51" fill="none" stroke="#67E8F9" stroke-width="1.4" stroke-dasharray="5 8" stroke-opacity=".85">
    <animateTransform attributeName="transform" type="rotate" from="0 92 48" to="360 92 48" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="92" cy="48" r="33" fill="none" stroke="#C084FC" stroke-opacity=".5" stroke-dasharray="2 6">
    <animateTransform attributeName="transform" type="rotate" from="360 92 48" to="0 92 48" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="92" cy="48" r="26" fill="#151039" stroke="url(#neon)" stroke-width="2"/>
  <path d="M82 38L72 48L82 58M102 38L112 48L102 58M98 32L86 64" fill="none" stroke="#D8B4FE" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="3" r="5" fill="#67E8F9"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="24" cy="105" r="4" fill="#A78BFA"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
</g>
